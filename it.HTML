<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendX — Select Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF9F6;
    --cream:#FFFDF8;
    --beige:#F5EFE6;
    --orange:#D96A16;
    --orange-light:#F08A3C;
    --navy:#1F3A6D;
    --navy-soft:#3A5382;
    --border:#E8E8E8;
    --glass-fill: rgba(255,255,255,0.42);
    --glass-fill-strong: rgba(255,255,255,0.62);
    --glass-border: rgba(255,255,255,0.75);
    --shadow-soft: 0 20px 60px -20px rgba(31,58,109,0.18), 0 4px 16px -4px rgba(31,58,109,0.08);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }

  body{
    font-family:'Inter', sans-serif;
    color:var(--navy);
    background:
      radial-gradient(1100px 700px at 12% 8%, #FFFDF8 0%, transparent 60%),
      radial-gradient(1200px 800px at 88% 92%, #F5EFE6 0%, transparent 55%),
      linear-gradient(160deg, #FAF9F6 0%, #F7F2EA 45%, #F3ECE0 100%);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    padding-bottom:80px;
  }

  /* ---------- Reeded glass watermark crest ---------- */
  .crest-stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:0;
  }
  .fluted-crest{ width:min(58vw, 720px); height:min(58vw, 720px); position:relative; }
  .fluted-crest svg{ width:100%; height:100%; opacity:0.05; }
  .flutes{
    position:absolute; inset:-10%;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.05) 3px,
      rgba(31,58,109,0.045) 6px, rgba(255,255,255,0.35) 9px, rgba(255,255,255,0.55) 12px
    );
    mix-blend-mode:soft-light;
    -webkit-mask-image: radial-gradient(circle, black 55%, transparent 78%);
            mask-image: radial-gradient(circle, black 55%, transparent 78%);
    animation: fluteShift 22s linear infinite;
  }
  @keyframes fluteShift{ 0%{background-position-x:0px;} 100%{background-position-x:240px;} }

  .orb{ position:absolute; border-radius:50%; filter:blur(60px); opacity:0.3; z-index:0; animation: drift 16s ease-in-out infinite; }
  .orb-1{ width:300px; height:300px; background:var(--orange-light); top:6%; left:4%; }
  .orb-2{ width:260px; height:260px; background:var(--navy-soft); bottom:4%; right:6%; opacity:0.14; animation-delay:-6s; }
  @keyframes drift{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(24px,-18px);} }

  /* ---------- Top bar ---------- */
  .topbar{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:32px 48px 0;
    animation: fadeIn 0.8s ease both;
  }

  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px;
    background:linear-gradient(145deg, var(--navy) 0%, var(--navy-soft) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px -4px rgba(31,58,109,0.35);
    position:relative; overflow:hidden;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.18) 0px, rgba(255,255,255,0.18) 1px, transparent 1px, transparent 4px);
  }
  .brand-mark svg{ width:20px; height:20px; position:relative; z-index:1; }
  .brand-word{ font-family:'Outfit', sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.02em; color:var(--navy); }
  .brand-word span{ color:var(--orange); }
  .brand-sub{ font-size:11px; color:#8b8478; letter-spacing:0.08em; text-transform:uppercase; margin-top:-2px; }

  .back-link{
    display:flex; align-items:center; gap:8px;
    padding:10px 18px 10px 14px;
    border-radius:999px;
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:var(--shadow-soft);
    font-size:13px;
    font-weight:500;
    color:var(--navy-soft);
    text-decoration:none;
    transition: all .3s cubic-bezier(.4,0,.2,1);
  }
  .back-link:hover{ color:var(--navy); background:var(--glass-fill-strong); }
  .back-link svg{ flex:0 0 auto; }

  @media (max-width:640px){
    .topbar{ padding:26px 22px 0; }
    .back-link span{ display:none; }
  }

  /* ---------- Heading / intro ---------- */
  .intro{
    position:relative; z-index:2;
    max-width:720px;
    margin:64px auto 0;
    padding:0 24px;
    text-align:center;
    animation: riseIn 0.9s cubic-bezier(.16,1,.3,1) both;
  }

  .intro-eyebrow{
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--orange); font-weight:600; margin-bottom:14px;
  }
  .intro-title{
    font-family:'Outfit', sans-serif;
    font-size:34px; font-weight:700; letter-spacing:-0.015em;
    color:var(--navy); margin:0 0 12px;
  }
  .intro-sub{
    font-size:15px; color:#7b7566; line-height:1.7;
  }
  .intro-sub strong{ color:var(--navy); }

  /* ---------- Section grid ---------- */
  .section-grid{
    position:relative; z-index:2;
    max-width:820px;
    margin:44px auto 0;
    padding:0 40px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:22px;
  }

  @media (max-width:720px){
    .section-grid{ grid-template-columns:repeat(2, 1fr); padding:0 28px; }
  }
  @media (max-width:480px){
    .section-grid{ grid-template-columns:1fr; padding:0 20px; }
    .intro-title{ font-size:26px; }
  }

  .section-card{
    position:relative;
    border-radius:22px;
    padding:32px 24px;
    background:var(--glass-fill);
    border:1px solid var(--border);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow: 0 14px 34px -18px rgba(31,58,109,0.16);
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    overflow:hidden;
    transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s ease, border-color .4s ease, background .4s ease;
    opacity:0;
    animation: cardIn 0.7s cubic-bezier(.16,1,.3,1) forwards;
  }

  .section-card::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.04) 3px,
      rgba(31,58,109,0.03) 6px, rgba(255,255,255,0.22) 9px, rgba(255,255,255,0.4) 12px
    );
    mix-blend-mode:soft-light;
    opacity:0.6;
    pointer-events:none;
  }

  .section-card:hover{
    transform:translateY(-6px);
    box-shadow: 0 26px 50px -20px rgba(31,58,109,0.26);
    border-color:rgba(217,106,22,0.35);
    background:var(--glass-fill-strong);
  }

  .section-card:active{ transform:translateY(-2px) scale(0.995); }

  .section-badge{
    width:56px; height:56px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, rgba(31,58,109,0.08), rgba(217,106,22,0.08));
    border:1px solid var(--border);
    position:relative; z-index:1;
    font-family:'Outfit', sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--navy);
    transition: background .4s ease, transform .4s ease, color .4s ease;
  }
  .section-card:hover .section-badge{
    background:linear-gradient(145deg, var(--navy), var(--navy-soft));
    color:var(--cream);
    transform:scale(1.06) rotate(-3deg);
  }

  .section-body{ position:relative; z-index:1; text-align:center; }
  .section-label{
    font-family:'Outfit', sans-serif;
    font-size:16px; font-weight:700;
    color:var(--navy);
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .section-count{
    font-size:12px;
    color:#8b8478;
  }

  @keyframes cardIn{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(20px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(-8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .empty-state{
    position:relative; z-index:2;
    max-width:480px;
    margin:44px auto 0;
    padding:0 24px;
    text-align:center;
    color:#7b7566;
    font-size:14px;
    display:none;
  }
  .empty-state a{ color:var(--orange); font-weight:600; text-decoration:none; }
</style>
<style>
  /* ---------- Floating attendance button ---------- */
  .attendance-fab{
    position:fixed;
    right:32px;
    bottom:32px;
    z-index:50;
    width:64px; height:64px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
    color:#fff;
    box-shadow:0 14px 30px -8px rgba(217,106,22,0.55), 0 4px 14px -2px rgba(217,106,22,0.3);
    transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s ease, filter .25s ease;
  }
  .attendance-fab:hover{ transform:translateY(-3px) scale(1.04); filter:brightness(1.05); }
  .attendance-fab:active{ transform:translateY(0) scale(0.97); }
  .attendance-fab svg{ width:26px; height:26px; }
 
  .attendance-fab-label{
    position:fixed;
    right:32px;
    bottom:104px;
    z-index:50;
    font-size:11.5px;
    font-weight:600;
    color:var(--navy-soft);
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    padding:6px 12px;
    border-radius:999px;
    box-shadow:var(--shadow-soft);
    pointer-events:none;
    opacity:0;
    transform:translateY(6px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .attendance-fab-wrap:hover .attendance-fab-label{ opacity:1; transform:translateY(0); }
 
  @media (max-width:640px){
    .attendance-fab{ right:20px; bottom:20px; width:58px; height:58px; }
    .attendance-fab-label{ display:none; }
  }
 
  /* ---------- Shared dark overlay ---------- */
  .attendance-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(20,28,46,0.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    padding:24px;
  }
  .attendance-overlay.is-open{ display:flex; }
 
  .attendance-card{
    position:relative;
    width:min(420px, 100%);
    border-radius:26px;
    background:var(--cream);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow-soft);
    overflow:hidden;
    animation: attendanceIn 0.35s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes attendanceIn{
    from{ opacity:0; transform:translateY(18px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
 
  .attendance-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px;
    border-bottom:1px solid var(--border);
  }
  .attendance-title{
    font-family:'Outfit', sans-serif;
    font-size:16px; font-weight:700;
    color:var(--navy);
    margin:0;
  }
  .attendance-close{
    width:30px; height:30px;
    border-radius:50%;
    border:none;
    background:var(--beige);
    color:var(--navy-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, color .2s ease;
  }
  .attendance-close:hover{ background:var(--orange); color:#fff; }
 
  /* ---------- Step 1: choice screen ---------- */
  .choice-body{
    padding:26px 22px 30px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .choice-option{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid var(--border);
    background:var(--glass-fill-strong, rgba(255,255,255,0.6));
    cursor:pointer;
    text-align:left;
    font-family:'Inter', sans-serif;
    transition: transform .25s cubic-bezier(.4,0,.2,1), border-color .25s ease, background .25s ease;
  }
  .choice-option:hover{
    transform:translateY(-2px);
    border-color:rgba(217,106,22,0.4);
    background:var(--cream);
  }
  .choice-icon{
    flex:0 0 auto;
    width:42px; height:42px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, rgba(31,58,109,0.08), rgba(217,106,22,0.08));
    color:var(--navy);
  }
  .choice-icon svg{ width:20px; height:20px; }
  .choice-text-title{ font-size:14.5px; font-weight:600; color:var(--navy); margin:0 0 2px; }
  .choice-text-sub{ font-size:12px; color:#8b8478; margin:0; }
 
  /* ---------- Step 2: camera / preview screen ---------- */
  .camera-body{
    position:relative;
    background:#0d1420;
    aspect-ratio:4/3;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .camera-video, .camera-canvas-preview{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .camera-canvas-preview{ display:none; }
 
  .camera-status{
    position:absolute;
    inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
    font-size:13.5px;
    color:#d7dce6;
    background:rgba(13,20,32,0.85);
  }
  .camera-status.is-hidden{ display:none; }
 
  .camera-footer{
    display:flex; align-items:center; justify-content:center;
    gap:16px;
    padding:20px 22px 24px;
  }
 
  .capture-btn{
    width:60px; height:60px;
    border-radius:50%;
    border:3px solid var(--orange);
    background:#fff;
    cursor:pointer;
    position:relative;
    transition: transform .2s ease;
  }
  .capture-btn::after{
    content:"";
    position:absolute; inset:6px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
  }
  .capture-btn:hover{ transform:scale(1.05); }
  .capture-btn:active{ transform:scale(0.95); }
 
  .retake-btn, .submit-btn, .back-btn{
    padding:12px 22px;
    border-radius:999px;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition: transform .2s ease, filter .2s ease;
  }
  .retake-btn, .back-btn{
    background:var(--beige);
    color:var(--navy);
  }
  .submit-btn{
    background:linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
    color:#fff;
    box-shadow:0 10px 22px -8px rgba(217,106,22,0.45);
  }
  .retake-btn:hover, .submit-btn:hover, .back-btn:hover{ transform:translateY(-2px); filter:brightness(1.03); }
 
  .is-hidden{ display:none !important; }
</style>
 

</head>
<body>

  <div class="crest-stage">
    <div class="fluted-crest">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#1F3A6D" stroke-width="2"/>
        <circle cx="100" cy="100" r="78" fill="none" stroke="#1F3A6D" stroke-width="1.2"/>
        <path d="M100 30 L118 70 L162 76 L130 106 L138 150 L100 128 L62 150 L70 106 L38 76 L82 70 Z" fill="#1F3A6D"/>
        <text x="100" y="182" text-anchor="middle" font-family="Outfit, sans-serif" font-size="13" letter-spacing="2" fill="#1F3A6D">S.R.K.R ENGINEERING COLLEGE</text>
      </svg>
      <div class="flutes"></div>
    </div>
  </div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12l2 2 4-4" stroke="#FFFDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="9" stroke="#FFFDF8" stroke-width="1.6"/>
        </svg>
      </div>
      <div>
        <div class="brand-word">Attend<span>X</span></div>
        <div class="brand-sub">S.R.K.R Engineering College</div>
      </div>
    </div>

    <a class="back-link" href="Departments.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Change department</span>
    </a>
  </div>

  <div class="intro">
    <div class="intro-eyebrow" id="deptEyebrow">IT</div>
    <h1 class="intro-title" id="deptTitle">Select your section</h1>
    <p class="intro-sub" id="deptSub">Choose your section to continue to your attendance dashboard.</p>
  </div>

  <div class="section-grid" id="sectionGrid">
    <!-- cards injected by script -->
  </div>

  <div class="empty-state" id="emptyState">
    No department was selected. Please <a href="Departments.html">go back and choose a department</a> first.
  </div>

  <script>
    // Full names for every department code, kept in sync with the Departments page.
    const departmentNames = {
      CSE:   "Computer Science &amp; Engineering",
      IT:    "Information Technology",
      ECE:   "Electronics &amp; Communication Engineering",
      EEE:   "Electrical &amp; Electronics Engineering",
      MECH:  "Mechanical Engineering",
      CIVIL: "Civil Engineering",
      CSIT:  "Computer Science &amp; Information Technology",
      CSBS:  "Computer Science &amp; Business Systems",
      AIDS:  "AI &amp; Data Science",
    };

    // Each department can define its own section list; falls back to A/B/C if not listed.
    const sectionsByDept = {
      IT:   ["A", "B", "C"],
      CSE:  ["A", "B", "C", "D"],
      ECE:  ["A", "B", "C"],
      EEE:  ["A", "B"],
      MECH: ["A", "B"],
      CIVIL:["A", "B"],
      CSIT: ["A", "B"],
      CSBS: ["A"],
      AIDS: ["A"],
    };

    const params = new URLSearchParams(window.location.search);
    // Falls back to IT when the page is opened directly (no ?dept= in the URL)
    const deptCode = (params.get('dept') || 'IT').toUpperCase().trim();

    const grid = document.getElementById('sectionGrid');
    const emptyState = document.getElementById('emptyState');
    const deptEyebrow = document.getElementById('deptEyebrow');
    const deptTitle = document.getElementById('deptTitle');
    const deptSub = document.getElementById('deptSub');

    if (!deptCode || !departmentNames[deptCode]) {
      grid.style.display = 'none';
      emptyState.style.display = 'block';
      deptTitle.textContent = 'No department selected';
      deptSub.textContent = 'Pick a department first to see its sections.';
    } else {
      const deptName = departmentNames[deptCode];;
      deptTitle.textContent = 'Select your section';
      deptSub.innerHTML = `Choose your section within <strong>${deptName}</strong> to continue to your attendance dashboard.`;

      const sections = sectionsByDept[deptCode] || ["A", "B", "C"];

      sections.forEach((section, i) => {
        const card = document.createElement('a');
        card.href = `Dashboard.html?dept=${encodeURIComponent(deptCode)}&section=${encodeURIComponent(section)}`;
        card.className = 'section-card';
        card.style.animationDelay = (i * 0.06) + 's';
        card.setAttribute('data-section', section);
        card.innerHTML = `
          <div class="section-badge">${section}</div>
          <div class="section-body">
            <p class="section-label">Section ${section}</p>
            <p class="section-count">${deptCode} · ${section}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
