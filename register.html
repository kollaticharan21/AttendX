<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendX — Register Person</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF9F6;
    --cream:#FFFDF8;
    --beige:#F5EFE6;
    --orange:#D96A16;
    --orange-light:#F08A3C;
    --navy:#1F3A6D;
    --navy-soft:#3A5382;
    --border:#E8E8E8;
    --glass-fill: rgba(255,255,255,0.42);
    --glass-border: rgba(255,255,255,0.75);
    --shadow-soft: 0 20px 60px -20px rgba(31,58,109,0.18), 0 4px 16px -4px rgba(31,58,109,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Inter', sans-serif;
    color:var(--navy);
    background:
      radial-gradient(1100px 700px at 12% 8%, #FFFDF8 0%, transparent 60%),
      radial-gradient(1200px 800px at 88% 92%, #F5EFE6 0%, transparent 55%),
      linear-gradient(160deg, #FAF9F6 0%, #F7F2EA 45%, #F3ECE0 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .brand{ position:absolute; top:36px; left:44px; display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px;
    background:linear-gradient(145deg, var(--navy) 0%, var(--navy-soft) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px -4px rgba(31,58,109,0.35);
  }
  .brand-mark svg{ width:20px; height:20px; }
  .brand-word{ font-family:'Outfit', sans-serif; font-weight:700; font-size:20px; color:var(--navy); }
  .brand-word span{ color:var(--orange); }

  .card{
    width:min(520px, 94vw);
    padding:44px 40px;
    border-radius:22px;
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    box-shadow:var(--shadow-soft);
  }

  h2{ font-family:'Outfit', sans-serif; font-size:26px; margin:0 0 6px; }
  .sub{ color:#7b7566; font-size:14px; margin:0 0 28px; }

  label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:6px; color:var(--navy-soft); }
  .field{ margin-bottom:20px; }
  input[type="text"], input[type="file"]{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--cream);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    color:var(--navy);
  }
  input[type="text"]:focus{ outline:2px solid var(--orange-light); }

  .hint{ font-size:12.5px; color:#9a927f; margin-top:6px; }

  .preview{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;
  }
  .preview img{
    width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border);
  }

  .btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
    color:#fff;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(217,106,22,0.45);
    margin-top:8px;
  }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }

  .message{
    margin-top:16px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13.5px;
    display:none;
  }
  .message.success{ display:block; background:#E6F4EA; color:#1E7E34; }
  .message.error{ display:block; background:#FBEAEA; color:#C0392B; }

  .back-link{
    display:inline-block;
    margin-top:18px;
    font-size:13.5px;
    color:var(--navy-soft);
    text-decoration:none;
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 12l2 2 4-4" stroke="#FFFDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="9" stroke="#FFFDF8" stroke-width="1.6"/>
      </svg>
    </div>
    <div class="brand-word">Attend<span>X</span></div>
  </div>

  <div class="card">
    <h2>Register a Person</h2>
    <p class="sub">Upload at least 3 clear photos of one person's face. Admin login required.</p>

    <form id="registerForm">
      <div class="field">
        <label for="personName">Full Name</label>
        <input type="text" id="personName" placeholder="e.g. Charan" required>
      </div>

      <div class="field">
        <label for="regNumber">Registration Number</label>
        <input type="text" id="regNumber" placeholder="e.g. 21B01A0501" required>
      </div>

      <div class="field">
        <label for="department">Department</label>
        <select id="department" required style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--cream); font-family:'Inter', sans-serif; font-size:14.5px; color:var(--navy);">
          <option value="" disabled selected>Select department</option>
          <option value="CSE">Computer Science &amp; Engineering</option>
          <option value="IT">Information Technology</option>
          <option value="ECE">Electronics &amp; Communication Engineering</option>
          <option value="EEE">Electrical &amp; Electronics Engineering</option>
          <option value="MECH">Mechanical Engineering</option>
          <option value="CIVIL">Civil Engineering</option>
          <option value="CSIT">Computer Science &amp; Information Technology</option>
          <option value="CSBS">Computer Science &amp; Business Systems</option>
          <option value="AIDS">AI &amp; Data Science</option>
        </select>
      </div>

      <div class="field">
        <label for="section">Section</label>
        <select id="section" required style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--cream); font-family:'Inter', sans-serif; font-size:14.5px; color:var(--navy);">
          <option value="" disabled selected>Select section</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
        </select>
      </div>

      <div class="field">
        <label for="year">Academic Year</label>
        <select id="year" required style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--cream); font-family:'Inter', sans-serif; font-size:14.5px; color:var(--navy);">
          <option value="1">First Year</option>
          <option value="2" selected>Second Year</option>
          <option value="3">Third Year</option>
          <option value="4">Fourth Year</option>
        </select>
      </div>

      <div class="field">
        <label for="photos">Photos (minimum 3)</label>
        <input type="file" id="photos" accept=".jpg,.jpeg,.png" multiple required>
        <div class="hint">Clear, well-lit, front-facing photos work best — different angles help accuracy.</div>
        <div class="preview" id="preview"></div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Register Person</button>
    </form>

    <div class="message" id="message"></div>

    <a href="departments.html" class="back-link">&larr; Back to Departments</a>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const photosInput = document.getElementById('photos');
    const preview = document.getElementById('preview');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const API_BASE = window.location.protocol === 'file:' ||
      ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? 'http://127.0.0.1:5000'
      : '/api';

    // If there's no admin token saved from login, send them back to sign in
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    if (!token || role !== 'admin') {
      window.location.href = 'index.html';
    }

    // Show small thumbnails of selected photos
    photosInput.addEventListener('change', () => {
      preview.innerHTML = '';
      Array.from(photosInput.files).forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
      });
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      messageBox.className = 'message';
      messageBox.style.display = 'none';

      const name = document.getElementById('personName').value.trim();
      const regNumber = document.getElementById('regNumber').value.trim();
      const department = document.getElementById('department').value;
      const section = document.getElementById('section').value;
      const year = document.getElementById('year').value;
      const files = photosInput.files;

      if (files.length < 3) {
        messageBox.textContent = 'Please select at least 3 photos.';
        messageBox.className = 'message error';
        return;
      }

      const formData = new FormData();
      formData.append('name', name);
      formData.append('reg_number', regNumber);
      formData.append('department', department);
      formData.append('section', section);
      formData.append('year', year);
      Array.from(files).forEach(file => formData.append('photos', file));

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const response = await fetch(`${API_BASE}/register-person`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          },
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          messageBox.textContent = data.message;
          messageBox.className = 'message success';
          form.reset();
          preview.innerHTML = '';
        } else {
          messageBox.textContent = data.message;
          messageBox.className = 'message error';
        }
      } catch (err) {
        messageBox.textContent = 'Could not reach the server. Is app.py running?';
        messageBox.className = 'message error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Person';
      }
    });
  </script>

</body>
</html>
