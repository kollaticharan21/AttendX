<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AttendX - CSIT Sections</title><style>body{font-family:Arial,sans-serif;background:#f5efe6;color:#1f3a6d;text-align:center;padding:40px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:800px;margin:40px auto}.card{padding:30px 16px;background:#fffdf8;border:1px solid #e8e8e8;border-radius:16px;color:#1f3a6d;text-decoration:none}.badge{font-size:28px;font-weight:bold;display:block;margin-bottom:12px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}a.back{display:inline-block;margin:20px;color:#d96a16}</style></head><body><a class="back" href="departments.html">Back to departments</a><p>CSIT</p><h1>Select your section</h1><p>Computer Science &amp; Information Technology</p><section class="grid"><a class="card" href="dashboard.html?dept=CSIT&amp;section=A"><span class="badge">A</span>Section A</a><a class="card" href="dashboard.html?dept=CSIT&amp;section=B"><span class="badge">B</span>Section B</a><a class="card" href="dashboard.html?dept=CSIT&amp;section=C"><span class="badge">C</span>Section C</a><a class="card" href="dashboard.html?dept=CSIT&amp;section=D"><span class="badge">D</span>Section D</a></section><script>const year=['1','2','3','4'].includes(new URLSearchParams(location.search).get('year'))?new URLSearchParams(location.search).get('year'):'2';document.querySelectorAll('.card').forEach(card=>card.href+=`&year=${year}`);</script></body></html>
